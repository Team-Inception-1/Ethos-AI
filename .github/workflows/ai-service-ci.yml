name: "AI Microservice — Lint / Pytest"

on:
  push:
    branches: [main, repair/full-stabilization]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  workflow_dispatch: {}

jobs:
  ai-service-tests:
    name: "AI Microservice — Python 3.11 & Pytest"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: apps/ai-service/requirements.txt

      - name: Install system dependencies (Tesseract OCR & Poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr libtesseract-dev poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest suite
        run: pytest
        env:
          OFFLINE_DEMO: "true"
          ENVIRONMENT: "test"

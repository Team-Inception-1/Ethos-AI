name: AI Service CI

# Scoped to apps/ai-service only (Issue #16 / K-17). The full-repo CI/CD
# pipeline (lint/typecheck/build gating on every PR) is Taha's Issue #20 —
# this workflow intentionally does not expand into that scope.

on:
  push:
    branches: [main, feature/16-ai-agreement-analyzer]
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  pull_request:
    paths:
      - "apps/ai-service/**"
      - ".github/workflows/ai-service-ci.yml"
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (tesseract + poppler for OCR)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run offline unit/API test suite (no API key required)
        run: pytest -v

      - name: Live Gemini smoke test (uses GEMINI_API_KEY secret if present)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/smoke_test_gemini.py

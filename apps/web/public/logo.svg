  <text x="50" y="31" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="700" fill="#F5F1E8" letter-spacing="-0.5">Ethos</text>
  <text x="114" y="31" font-family="'Space Grotesk', system-ui, sans-serif" font-size="22" font-weight="800" fill="url(#full-ai-text)" letter-spacing="-0.5">AI</text>

<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pub-icon-grad-top" x1="16" y1="8" x2="48" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4F8EF7" />
      <stop offset="100%" stop-color="#2FD3E8" />
    </linearGradient>
    <linearGradient id="pub-icon-grad-right" x1="48" y1="20" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9B6BFF" />

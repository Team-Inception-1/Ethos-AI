    </linearGradient>
    <linearGradient id="pub-icon-grad-left" x1="16" y1="20" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#17C989" />
      <stop offset="100%" stop-color="#2FD3E8" />
